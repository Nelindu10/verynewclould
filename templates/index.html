<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartMove Transport</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* pata pata*/
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        /* Navigation Bar CSS */
        .navbar {
            background-color: #1e293b;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .navbar a {
            float: left;
            display: block;
            color: #f1f5f9;
            text-align: center;
            padding: 16px 24px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .navbar a:hover {
            background-color: #3b82f6;
            color: white;
        }

        /* Form Container CSS */
        .container {
            max-width: 500px;
            margin: 50px auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.15);
        }
        h2 {
            color: #1e293b;
            text-align: center;
            margin-bottom: 25px;
        }
        label {
            color: #334155;
            font-size: 14px;
        }
        input[type=text], input[type=email], input[type=password] {
            width: 100%;
            padding: 12px;
            margin: 8px 0 20px 0;
            display: inline-block;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            background-color: #f8fafc;
            transition: border 0.3s;
        }
        input:focus {
            border-color: #3b82f6;
            outline: none;
        }
        button {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 14px 20px;
            margin: 10px 0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(16, 185, 129, 0.3);
        }

        /* Data Display Table CSS */
        .data-container {
            max-width: 600px;
            margin: 20px auto 50px auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.15);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background-color: #1e293b;
            color: white;
        }
        tr:hover {
            background-color: #f1f5f9;
        }
        .success-msg {
            background-color: #d1fae5;
            color: #065f46;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            margin-bottom: 20px;
            border: 1px solid #a7f3d0;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar -->
    <div class="navbar">
        <a href="/">Home</a>
        <a href="/register">Register</a>
        <a href="/login">Login</a>
    </div>

    <!-- Registration Form -->
    <div class="container">
        <h2>Passenger Registration</h2>


        {% if success %}
            <div class="success-msg">Successfully Registered! 🎉</div>
        {% endif %}

        <form action="/register" method="post">
            <label for="name"><b>Full Name</b></label>
            <input type="text" placeholder="Enter full name" name="name" required>

            <label for="email"><b>Email</b></label>
            <input type="email" placeholder="Enter your email" name="email" required>

            <label for="psw"><b>Password</b></label>
            <input type="password" placeholder="Enter new password" name="psw" required>

            <button type="submit">Register now</button>
        </form>
    </div>

    <!-- MongoDB Data Display Section -->
    <div class="data-container">
        <h2>Registered Passengers (MongoDB)</h2>
        <table>
            <tr>
                <th>Name</th>
                <th>Email</th>
            </tr>
            {% for p in passengers %}
            <tr>
                <td>{{ p.name }}</td>
                <td>{{ p.email }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="2" style="text-align: center; color: #94a3b8; font-style: italic;">No passengers found in the database.</td>
            </tr>
            {% endfor %}
        </table>
    </div>

</body>
</html>
